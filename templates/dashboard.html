<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Disorder Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-top: 3rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .form-container {
            width: 90%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 4rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            transition: color 0.3s ease;
        }

        input, select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        /* Specifically style dropdown options */
        select option {
            background: var(--bg-color);
            color: white;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            background: rgba(0, 0, 0, 0.4);
        }

        input:focus + label, select:focus + label {
            color: var(--accent);
        }

        .submit-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
        }

        button {
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(56, 189, 248, 0.5);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(56, 189, 248, 0.7);
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <header>
        <h1>Genetic AI Predictor</h1>
        <p class="subtitle">Enter patient data below for XGBoost analysis</p>
        <div style="margin-top: 1rem;">
            <a href="/logout" style="color: #ef4444; text-decoration: none; font-weight: 600; background: rgba(239, 68, 68, 0.1); padding: 0.5rem 1rem; border-radius: 8px;">Logout</a>
        </div>
    </header>

    <div class="form-container">
        <form action="/predict" method="POST">
            <div class="features-grid">
                {% for feature, f_type in features.items() %}
                <div class="input-group">
                    <label for="{{ feature }}">{{ feature }}</label>
                    {% if f_type == 'numerical' %}
                        <input type="number" step="any" id="{{ feature }}" name="{{ feature }}" placeholder="Enter number..." required>
                    {% else %}
                        <select id="{{ feature }}" name="{{ feature }}" required>
                            <option value="" disabled selected>Select an option...</option>
                            {% for opt in f_type %}
                                <option value="{{ opt }}">{{ opt }}</option>
                            {% endfor %}
                        </select>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="submit-container">
                    <button type="submit">Analyze Patient Data</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
